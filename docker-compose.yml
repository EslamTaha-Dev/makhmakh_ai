x-backend-build: &backend-build
  context: ./back
  dockerfile: Dockerfile

x-backend-env-files: &backend-env-files
  - ./.env

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://postgres:Postgres123!@postgres:5432/bosla
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bosla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres123!
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bosla"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      <<: *backend-build
      target: api
    env_file: *backend-env-files
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.db.seed_roles
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_UPLOAD_MAX_SIZE_MB: ${NEXT_PUBLIC_UPLOAD_MAX_SIZE_MB:-100}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  api:
    build:
      <<: *backend-build
      target: api
    env_file: *backend-env-files
    environment:
      <<: *backend-environment
    volumes:
      # The worker fleet reads the same uploads directory as the API.
      - uploads:/app/uploads
      - generated:/app/generated
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "8000:8000"

  material-worker:
    build:
      <<: *backend-build
      target: material-worker
    env_file: *backend-env-files
    command:
      - rq
      - worker
      - material_processing
      - --url
      - redis://redis:6379/0
    environment:
      <<: *backend-environment
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  video-worker:
    profiles: ["media"]
    build:
      <<: *backend-build
      target: video-worker
    env_file: *backend-env-files
    environment:
      <<: *backend-environment
    volumes:
      - generated:/app/generated
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  uploads:
  generated:
  pgdata:

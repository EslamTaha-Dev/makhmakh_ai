services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bosla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres123!
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bosla"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./back
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:Postgres123!@postgres:5432/bosla
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/2
      JWT_SECRET_KEY: change-this-in-local-env
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  arq-worker:
    build:
      context: ./back
    command: ["arq", "arq_worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:Postgres123!@postgres:5432/bosla
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/2
      JWT_SECRET_KEY: change-this-in-local-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:

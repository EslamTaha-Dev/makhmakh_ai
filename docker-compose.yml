x-backend-image: &backend-image
  image: makhmakh-backend:local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bosla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres123!
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bosla"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend-image
    build:
      context: ./back
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:Postgres123!@postgres:5432/bosla
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/2
      JWT_SECRET_KEY: change-this-in-local-env
      FRONTEND_URL: http://localhost:3000
    volumes:
      # The worker fleet reads the same uploads directory as the API.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  rq-worker:
    <<: *backend-image
    command:
      - rq
      - worker
      - material_processing
      - video_generation
      - payment_processing
      - email_delivery
      - --url
      - redis://redis:6379/0
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:Postgres123!@postgres:5432/bosla
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/2
      JWT_SECRET_KEY: change-this-in-local-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  arq-worker:
    <<: *backend-image
    command: ["arq", "arq_worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:Postgres123!@postgres:5432/bosla
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/2
      JWT_SECRET_KEY: change-this-in-local-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  uploads:
  pgdata:

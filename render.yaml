services:
  - type: web
    name: makhmakh-api
    runtime: python
    plan: free
    branch: main
    rootDir: back
    buildCommand: pip install uv && uv pip install -r requirements-material.txt -r requirements-video.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_GATEWAY_PROVIDER
        value: gemini
      - key: RUN_JOBS_INLINE
        value: "true"
      - key: UPLOAD_DIR
        value: uploads
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: ACTIVE_EMBEDDING_MODEL
        value: intfloat/multilingual-e5-small
